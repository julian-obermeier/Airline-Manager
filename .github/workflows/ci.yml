name: CI

on:
  push:
    branches:
      - main
      - foundation/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: airline_manager
          POSTGRES_USER: airline_manager
          POSTGRES_PASSWORD: airline_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U airline_manager -d airline_manager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost
      APP_KEY: base64:KjOvh9H2qlnR0I6wzEHITQ+eG0REx3bF7d9ydL3bHwc=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: airline_manager
      DB_USERNAME: airline_manager
      DB_PASSWORD: airline_manager
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHP tests
        run: composer test

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
