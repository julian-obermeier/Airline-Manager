name: CI

on:
  push:
    branches:
      - main
      - foundation/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: airline_manager
          MARIADB_USER: airline_manager
          MARIADB_PASSWORD: airline_manager
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost
      APP_KEY: base64:KjOvh9H2qlnR0I6wzEHITQ+eG0REx3bF7d9ydL3bHwc=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: airline_manager
      DB_USERNAME: airline_manager
      DB_PASSWORD: airline_manager
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run PHP tests
        run: composer test

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Prepare production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Build ALL-INKL deployment archive
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./airline-manager-all-inkl.tar.gz' \
            -czf airline-manager-all-inkl.tar.gz .

      - name: Upload ALL-INKL deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: airline-manager-all-inkl
          path: airline-manager-all-inkl.tar.gz
          if-no-files-found: error
          retention-days: 14
